name: Enlaces rotos (mensual)
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --accept 200,206,301,302,403,429 'docs/**/*.html'
          fail: false
